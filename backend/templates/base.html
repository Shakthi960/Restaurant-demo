<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Galaxy Restaurants | Taste Tradition Together{% endblock %}</title>
  <meta name="description" content="Discover Galaxy Restaurants — a celebration of India's timeless flavours, traditional culinary heritage and modern hospitality across India.">
  <meta name="theme-color" content="#A92722">
  <style>
    html, body { background-color: #201d18; }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/animations.css">
  <link rel="stylesheet" href="/static/css/pages.css">
  <link rel="stylesheet" href="/static/css/lightbox.css">
  <link rel="stylesheet" href="/static/css/responsive.css">
  <link rel="icon" href="/static/assets/images/logo.png">
</head>
<body>

  <!-- ========== BRAND SPLASH (plays once per session) ========== -->
  <div class="splash" id="splash" aria-hidden="true">
    <div class="splash-inner">
      <img src="/static/assets/images/logo.png" alt="" class="splash-logo">
      <p class="splash-tagline">Taste Tradition Together</p>
    </div>
  </div>

  <!-- ========== SKIP LINK ========== -->
  <a class="skip-link" href="#main-content">Skip to main content</a>

  {% include 'partials/header.html' %}

  <main id="main-content">
    {% block content %}{% endblock %}
  </main>

  {% include 'partials/footer.html' %}

  <button class="scroll-top" id="scrollTop" aria-label="Scroll back to top">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M12 19V5M5 12l7-7 7 7"/>
    </svg>
  </button>

  <script src="/static/js/main.js"></script>
  <script src="/static/js/navigation.js"></script>
  <script src="/static/js/animations.js"></script>
  <script src="/static/js/reservation.js"></script>
  <script src="/static/js/contact.js"></script>
  <script src="/static/js/review.js"></script>
  <script src="/static/js/lightbox.js"></script>
</body>
</html>
