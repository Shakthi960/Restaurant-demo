<!-- ========== HEADER / NAVBAR (shared on every page) ========== -->
<header class="site-header" id="siteHeader">
  <div class="container header-inner">
    <a href="/" class="brand" aria-label="Galaxy Restaurants — Home">
      <img src="/static/assets/images/logo-wobg.png" alt="Galaxy Restaurants logo" class="brand-logo">
    </a>

    <nav class="main-nav" id="mainNav" aria-label="Primary navigation">
      <ul class="nav-list">
        <li><a href="/" class="nav-link {{ 'active' if active_page == 'home' }}">Home</a></li>
        <li><a href="/about" class="nav-link {{ 'active' if active_page == 'about' }}">About</a></li>
        <li><a href="/menu" class="nav-link {{ 'active' if active_page == 'menu' }}">Menu</a></li>
        <li><a href="/locations" class="nav-link {{ 'active' if active_page == 'locations' }}">Locations</a></li>
        <li><a href="/gallery" class="nav-link {{ 'active' if active_page == 'gallery' }}">Gallery</a></li>
        <li><a href="/reservations" class="nav-link {{ 'active' if active_page == 'reservations' }}">Reservations</a></li>
        <li><a href="/contact" class="nav-link {{ 'active' if active_page == 'contact' }}">Contact</a></li>
      </ul>
      <a href="/reservations" class="btn btn-primary nav-book-btn">Book a Table</a>
    </nav>

    <button class="hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false" aria-controls="mainNav">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>
  </div>
</header>
